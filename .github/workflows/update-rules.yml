name: Update rule sets

on:
  schedule:
    # Every Monday 04:23 Asia/Shanghai (Sunday 20:23 UTC).
    - cron: '23 20 * * 0'
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: 'Allow an upstream entry-count drop over 40% after manual review'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/update-rules.yml'

permissions:
  contents: read

concurrency:
  group: update-rule-sets
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run exact-deduplication and safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Install checksum-pinned official compiler
        run: python3 scripts/install_compiler.py
      - name: Record fixed-file checksums
        run: sha256sum data/ads.srs data/3WP.srs data/fakeip-filter.srs data/privateip.srs data/drive.srs data/telegram.srs data/privateip.json data/telegram.json data/v3.16.1-iOS16.4-Compat.zip data/v3.29.1-singbox.13-iOS16.4.zip > "$RUNNER_TEMP/fixed-rules.sha256"
      - name: Build all and proxy, mirror independent rule sets, validate complete snapshot
        env:
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop && '1' || '0' }}
        run: |
          if [ "$ALLOW_LARGE_DROP" = "1" ]; then
            python3 scripts/build.py --allow-large-drop
          else
            python3 scripts/build.py
          fi
          sha256sum --check SHA256SUMS
          sha256sum --check "$RUNNER_TEMP/fixed-rules.sha256"
      - name: Publish one complete, validated snapshot
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/all.json data/all.srs data/proxy.json data/proxy.srs \
            data/cnip.json data/cnip.srs data/cn.json data/cn.srs \
            data/ai.json data/ai.srs data/media.json data/media.srs \
            data/telegramip.json data/telegramip.srs data/spotify.json data/spotify.srs \
            data/private.json data/private.srs data/apple.json data/apple.srs \
            data/microsoft.json data/microsoft.srs data/github.json data/github.srs \
            SHA256SUMS build-info.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update rule sets and source audit manifest'
          git push origin HEAD:main
      - name: Summarize published snapshot
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          info = json.loads(Path('build-info.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Rule sets published\n\n')
              out.write('- Updated: ' + info['updated_at'] + '\n')
              out.write('- all: ' + str(info['outputs']['all']['entries']) + ' entries\n')
              out.write('- proxy: ' + str(info['outputs']['proxy']['entries']) + ' entries\n')
              out.write('- Removed from proxy: ' + str(info['proxy_removed_total']) + ' exact duplicates\n')
              out.write('- Independent mirrored rule sets: ' + str(len(info['mirrors'])) + '\n')
              out.write('- Fixed files preserved: ' + str(len(info['fixed_files'])) + '\n')
          PY
